<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDAGOG-IA | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-mode">
    <div class="glass-container">
        <header>
            <div class="logo">
                <span class="prefix">PEDAGOG</span><span class="suffix">-IA</span>
                <span class="tag">Industrial v4.0</span>
            </div>
            <div class="status-pill">
                <span class="pulse"></span> SISTEMA ONLINE
            </div>
        </header>

        <main>
            <!-- KPI Section -->
            <section class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon">📊</div>
                    <div class="kpi-info">
                        <span class="label">Evaluaciones</span>
                        <span class="value" id="total-evaluations">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">⚡</div>
                    <div class="kpi-info">
                        <span class="label">Refuerzos Activos</span>
                        <span class="value" id="active-reinforcements">0</span>
                    </div>
                </div>
                <div class="kpi-card accent-blue">
                    <div class="kpi-icon">💸</div>
                    <div class="kpi-info">
                        <span class="label">Costo IA (USD)</span>
                        <span class="value" id="total-cost">$0.00</span>
                    </div>
                </div>
                <div class="kpi-card accent-green">
                    <div class="kpi-icon">🕒</div>
                    <div class="kpi-info">
                        <span class="label">Latencia Media</span>
                        <span class="value" id="avg-latency">0ms</span>
                    </div>
                </div>
            </section>

            <div class="dashboard-grid">
                <!-- Cycles Section -->
                <section class="panel student-panel">
                    <h3>Ciclos Pedagógicos Recientes</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Estudiante</th>
                                    <th>Nota</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="cycles-table-body">
                                <!-- Data injected here -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Ops Section -->
                <section class="panel ops-panel">
                    <h3>IA-Ops Telemetry Feed</h3>
                    <div class="feed-container" id="ops-feed">
                        <!-- Log items injected here -->
                    </div>
                    <div class="chart-container">
                        <canvas id="latencyChart"></canvas>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <div class="footer-info">
                <span>Refresco automático activo</span>
                <span id="last-update">--:--:--</span>
            </div>
            <div class="credits">Antigravity AI Engine © 2026</div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
