<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico | PEDAGOG-IA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <header>
            <h1>📊 Dashboard Analítico SEA v4.0</h1>
            <p class="subtitle">Visualización de Competencias e IA Insights</p>
            <p id="last-update" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;"></p>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <div class="stat-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-file-invoice" style="color: #6366f1; font-size: 1.5rem; margin-bottom: 10px;"></i>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Total Evaluaciones</div>
                <div id="total-evals" style="font-size: 1.8rem; font-weight: bold;">0</div>
            </div>
            <div class="stat-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-graduation-cap" style="color: #10b981; font-size: 1.5rem; margin-bottom: 10px;"></i>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Nota Promedio</div>
                <div id="avg-grade" style="font-size: 1.8rem; font-weight: bold;">0.0</div>
            </div>
            <div class="stat-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-chart-line" style="color: #f59e0b; font-size: 1.5rem; margin-bottom: 10px;"></i>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Tasa Aprobación</div>
                <div id="pass-rate" style="font-size: 1.8rem; font-weight: bold;">0%</div>
            </div>
            <div class="stat-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-exclamation-triangle" style="color: #ef4444; font-size: 1.5rem; margin-bottom: 10px;"></i>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Alumnos en Riesgo</div>
                <div id="risk-count" style="font-size: 1.8rem; font-weight: bold;">0</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="chart-container">
                <h3 style="text-align: center; margin-bottom: 20px; color: var(--text-muted);">Desempeño por Competencias</h3>
                <canvas id="competencyChart"></canvas>
            </div>

            <div class="info-section">
                <div class="insight-card">
                    <h3><i class="fas fa-robot"></i> IA Insights Académicos</h3>
                    <p class="insight-text" id="ai-insight-text">
                        Cargando análisis inteligente de la cohorte...
                    </p>
                </div>
                
                <div id="risk-section" style="margin-top: 30px;">
                    <h3 style="color: #f87171; font-size: 1.1rem; margin-bottom: 15px;"><i class="fas fa-user-shield"></i> Alerta Temprana</h3>
                    <div id="at-risk-list" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Alumnos en riesgo aquí -->
                    </div>
                </div>

                <div style="margin-top: 30px; display: flex; gap: 10px;">
                    <button id="export-btn" style="flex: 1; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.3s;">
                        <i class="fas fa-file-pdf"></i> Exportar Reporte
                    </button>
                    <button onclick="location.reload()" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: white; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
